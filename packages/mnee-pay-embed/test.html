<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MNEE Pay Button Test</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        max-width: 800px;
        margin: 0 auto;
        padding: 40px 20px;
        background: #f5f5f5;
      }
      h1 {
        color: #111;
        margin-bottom: 40px;
      }
      .test-section {
        background: white;
        border-radius: 12px;
        padding: 24px;
        margin-bottom: 24px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }
      .test-section h2 {
        margin-top: 0;
        color: #333;
      }
      .test-section p {
        color: #666;
        margin-bottom: 16px;
      }
    </style>
  </head>
  <body>
    <h1>MNEE Pay Button Test Page</h1>

    <div class="test-section">
      <h2>Test Button</h2>
      <mnee-button api-base-url="http://localhost:3001" id="2373563c-d1c7-40c9-a565-df621ba3473d"></mnee-button>
    </div>

    <!-- Load the button script -->
    <!-- For development, serve from local build -->
    <script src="./dist/button.js"></script>
    <!-- For production, use CDN:
  <script src="https://pay.mnee.io/v1/button.js" async></script>
  -->

    <!-- Event listeners for testing -->
    <script>
      // Wait for the button to be defined
      customElements.whenDefined("mnee-button").then(() => {
        const button = document.querySelector("mnee-button");

        if (button) {
          // Payment completed successfully
          button.addEventListener("mnee-payment-success", (e) => {
            console.log("✅ [EVENT] mnee-payment-success:", e.detail);
          });

          // Payment failed or errored
          button.addEventListener("mnee-payment-error", (e) => {
            console.error("❌ [EVENT] mnee-payment-error:", e.detail);
          });

          // User cancelled/closed the checkout
          button.addEventListener("mnee-payment-cancel", (e) => {
            console.log("🚫 [EVENT] mnee-payment-cancel");
          });

          console.log("🎧 Event listeners registered on mnee-button");
        } else {
          console.warn("No mnee-button found on page");
        }
      });
    </script>
  </body>
</html>
